# Example only. Do not commit real credentials or include this file in kustomization.yaml.
# Prefer External Secrets, Sealed Secrets, or your cloud secret manager in production.
apiVersion: v1
kind: Secret
metadata:
  name: amrutam-secrets
  namespace: amrutam
type: Opaque
stringData:
  DATABASE_URL: postgresql://app:replace-me@postgres.example.internal:5432/amrutam?sslmode=require&schema=public
  REDIS_URL: rediss://default:replace-me@redis.example.internal:6379/0
  JWT_SECRET: replace-with-at-least-64-random-characters
  FIELD_ENCRYPTION_KEYS: v1:replace-with-a-base64-encoded-32-byte-random-key
  ACTIVE_FIELD_KEY_ID: v1
