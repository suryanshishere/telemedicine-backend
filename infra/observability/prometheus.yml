global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: local
    system: amrutam-telemedicine

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['prometheus:9090']

  - job_name: amrutam-api
    metrics_path: /metrics
    scheme: http
    static_configs:
      - targets: ['api:3000']
        labels:
          service: api

  - job_name: otel-collector
    static_configs:
      - targets: ['otel-collector:8888']

  - job_name: otel-exported-metrics
    static_configs:
      - targets: ['otel-collector:8889']
